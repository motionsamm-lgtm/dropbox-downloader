<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>GOB — Grab Our Bytes</title>
<style>
:root { color-scheme: light dark; font: 14px -apple-system,BlinkMacSystemFont,sans-serif; --bg:#f5f5f8; --card:#fff; --ink:#202126; --muted:#64666f; --line:#dedee5; --accent:#005acb; --tint:#e9f2ff }
@media(prefers-color-scheme:dark) {:root {--bg:#202125;--card:#2a2b30;--ink:#f3f3f6;--muted:#b8bac5;--line:#45464e;--accent:#80b8ff;--tint:#263c56}}
* {box-sizing:border-box} body {margin:0;background:var(--bg);color:var(--ink)} main {max-width:1150px;margin:auto;padding:28px}
header {margin-bottom:24px} h1 {margin:3px 0 7px;font-size:32px;letter-spacing:-.045em} h2 {margin:0;font-size:18px}
.eyebrow {font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.muted {color:var(--muted)} p {margin:0;line-height:1.45}
.grid {display:grid;grid-template-columns:minmax(290px,.86fr) minmax(340px,1.14fr);gap:16px;align-items:start}
.panel {border:1px solid var(--line);border-radius:16px;background:var(--card);padding:18px;min-width:0}
.section-head {display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:15px}
.field {display:grid;gap:5px;margin-bottom:12px;min-width:0} label,.label {font-weight:600} input:not([type=checkbox]),select {width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;padding:8px 9px}
button {border:1px solid var(--line);border-radius:8px;color:var(--ink);background:var(--bg);font:inherit;font-weight:600;padding:8px 11px;cursor:pointer;white-space:nowrap}
button:disabled {opacity:.47;cursor:default} button:active:not(:disabled) {transform:translateY(1px)}
button.primary {background:#0061d7;color:#fff;border-color:#0061d7}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible {outline:2px solid var(--accent);outline-offset:2px}
.row {display:flex;gap:7px;align-items:center;min-width:0} .row > input {flex:1}
.toggle {display:flex;align-items:center;gap:6px;font-weight:500;margin:8px 0}
.brutal {border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:10px;background:var(--tint)}
.brutal label {display:flex;align-items:center;gap:8px;margin-bottom:3px}.brutal p {font-size:12px}
details {margin:14px 0;color:var(--muted)} summary {cursor:pointer;color:var(--ink);font-weight:600} details > div {margin-top:12px}
.actions {display:flex;gap:7px;flex-wrap:wrap;margin-top:13px} .push {flex:1}
#formStart {width:100%} #jobs {display:grid;gap:6px;max-height:220px;overflow:auto;margin:0;padding:0;list-style:none}
.job {width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:var(--card)}
.job[aria-pressed=true] {background:var(--tint);border-color:var(--accent)} .name {overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status {font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap} .empty {padding:18px 4px;color:var(--muted)}
#transfer {margin-top:15px;padding:13px 0 0;border-top:1px solid var(--line)} #transferName {font-weight:700;overflow-wrap:anywhere}
#transferMessage {margin:4px 0 10px;overflow-wrap:anywhere}
progress {width:100%;accent-color:var(--accent);height:12px}
.metrics {display:flex;justify-content:space-between;gap:7px;margin-top:6px;color:var(--muted);font-size:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
#notice {margin-bottom:15px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--tint)}
dialog {width:min(420px,90vw);border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink);padding:17px}
dialog::backdrop {background:#0006} dialog p {margin:10px 0}
[hidden] {display:none!important}
@media(max-width:750px) {.grid {grid-template-columns:1fr} main {padding:19px} header {margin-bottom:17px} h1 {font-size:28px}}
@media(prefers-reduced-motion:reduce) {button:active:not(:disabled) {transform:none}}
</style>
</head>
<body>
<main>
<header><div class="eyebrow">GOB — Grab Our Bytes for Mac</div><h1>GOB <span class="muted" style="font-size:14px">1.1.4</span></h1><button id="updates" type="button">Check for updates</button><p class="muted">Save a file or download a folder file by file.</p></header>
<p id="notice" role="alert" hidden></p>
<div class="grid">
  <section class="panel" aria-labelledby="newTitle">
    <div class="section-head"><h2 id="newTitle">New download</h2></div>
    <form id="setup">
      <div class="field"><label for="link">Dropbox link</label><input id="link" type="url" placeholder="https://www.dropbox.com/…" required spellcheck="false"></div>
      <div class="field"><label for="name">Save as <span class="muted">(optional)</span></label><input id="name" placeholder="Use Dropbox filename"></div>
      <div class="field"><label for="destination">Save folder</label><div class="row"><input id="destination" readonly placeholder="Choose a folder"><button type="button" id="browse">Browse</button></div></div>
      <div class="brutal"><label><input id="brutal" type="checkbox" checked>Brutal</label><p class="muted">Up to 16 connections for files. Automatically switches to one on a retryable failure.</p></div>
      <label class="toggle"><input id="subfolder" type="checkbox">Create a subfolder named after the file</label>
      <label class="toggle"><input id="notifications" type="checkbox">Show macOS notifications</label>
      <details><summary>Transfer settings</summary><div>
        <div class="row"><div class="field"><label for="connections">Connections</label><select id="connections"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></div>
        <div class="field"><label for="speedCap">Cap (MiB/s)</label><input id="speedCap" type="number" min="0" max="999" value="0" title="0 means no cap"></div></div>
        <label class="toggle"><input id="onePass" type="checkbox">One pass (start a separate copy without resume)</label>
        <div class="field"><label for="checksum">Expected SHA-256 <span class="muted">(optional)</span></label><input id="checksum" spellcheck="false"></div>
      </div></details>
      <button id="formStart" type="submit" class="primary" disabled>Start download</button>
    </form>
  </section>
  <section class="panel" aria-labelledby="historyTitle">
    <div class="section-head"><h2 id="historyTitle">History</h2><span class="muted" id="count"></span></div>
    <ul id="jobs"></ul>
    <div id="transfer" hidden>
      <details id="folderFiles" hidden><summary id="folderFilesTitle">Files in this folder</summary><ul id="folderChildren"></ul></details>
      <p id="transferName"></p><p id="transferMessage" class="muted"></p>
      <progress id="progress" max="100" value="0" aria-label="Download progress"></progress>
      <div class="metrics"><span id="percent"></span><span id="bytes"></span><span id="speed"></span><span id="eta"></span></div>
      <div class="actions">
        <button type="button" id="pause" hidden>Pause</button><button type="button" id="resume" hidden>Resume</button>
        <button type="button" id="refresh" hidden>Update link</button><button type="button" id="reveal" hidden>Show in Finder</button>
        <button type="button" id="log">Open text log</button><button type="button" id="workingFolder">Saved data folder</button><button type="button" id="clearPartials">Clear partials…</button>
        <button type="button" id="remove">Remove from list…</button><button type="button" id="deleteFiles">Delete files…</button>
      </div>
    </div>
  </section>
</div>
</main>
<dialog id="resumeDialog">
  <form id="resumeForm">
    <h2 id="resumeTitle">Resume download</h2><p id="resumeDescription" class="muted"></p>
    <div id="newLinkField" class="field" hidden><label for="newLink">New Dropbox link</label><input id="newLink" type="url" spellcheck="false"></div>
    <div class="actions"><span class="push"></span><button type="button" id="cancel">Cancel</button><button class="primary" id="confirm" type="submit">Resume</button></div>
  </form>
</dialog>
<script>
const $ = id => document.getElementById(id);
const send = message => window.webkit.messageHandlers.downloads.postMessage(message);
const text = (id, value) => { $(id).textContent = value; };
let jobs = [], active = null, selected = null, online = false, pending = false, paused = false;
let dialogJob = null, editLink = false;
const bytes = n => n >= 1024 ** 3 ? (n / 1024 ** 3).toFixed(2) + ' GiB' :
  n >= 1024 ** 2 ? (n / 1024 ** 2).toFixed(1) + ' MiB' : n.toLocaleString() + ' B';
function eta(seconds) {
  const n = Math.max(1, Math.ceil(seconds));
  return n >= 3600 ? Math.floor(n / 3600) + 'h ' + Math.floor(n / 60 % 60) + 'm' :
    n >= 60 ? Math.floor(n / 60) + 'm ' + (n % 60) + 's' : n + 's';
}
function notice(message) { text('notice', message); $('notice').hidden = !message; }

function renderList() {
  const list = $('jobs');
  const focused = list.contains(document.activeElement) ? document.activeElement.dataset.id : null;
  const next = document.createDocumentFragment();
  if (!jobs.length) {
    const empty = document.createElement('li'); empty.className = 'empty';
    empty.textContent = 'Your downloads will appear here.'; next.append(empty);
  }
  for (const job of jobs) {
    const row = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button'; button.className = 'job'; button.dataset.id = job.id;
    button.setAttribute('aria-pressed', String(selected === job.id));
    const name = document.createElement('span'), state = document.createElement('span');
    name.className = 'name'; name.textContent = job.name;
    state.className = 'status'; state.textContent = job.status;
    button.append(name, state);
    button.onclick = () => { selected = job.id; render(); };
    row.append(button); next.append(row);
  }
  list.replaceChildren(next);
  if (focused) [...list.querySelectorAll('button')].find(b => b.dataset.id === focused)?.focus({ preventScroll: true });
}
let listSignature = '';
function render() {
  const job = jobs.find(j => j.id === selected);
  const signature = JSON.stringify([selected, jobs.map(j => [j.id, j.name, j.status])]);
  if (signature !== listSignature) { listSignature = signature; renderList(); }
  text('count', jobs.length ? String(jobs.length) : '');
  $('formStart').disabled = !online || Boolean(active) || pending;
  $('transfer').hidden = !job;
  if (!job) return;
  const done = job.status === 'Completed', m = job.metrics;
  const percentage = done ? 100 : m?.total > 0 ? Math.min(99.9, Math.floor(1000 * m.done / m.total) / 10) : 0;
  text('transferName', job.name);
  $('folderFiles').hidden = job.kind !== 'folder';
  if (job.kind === 'folder') {
    text('folderFilesTitle', 'Files in this folder' + (job.fileCount > 500 ? ' — showing first 500 of ' + job.fileCount : ''));
    const rows=(job.children || []).map(child=>{const li=document.createElement('li');li.textContent=child.name+' — '+child.status;return li;});
    $('folderChildren').replaceChildren(...rows);
  }
  text('transferMessage', paused && active === job.id ? 'Pausing. Saving the checkpoint…' : job.message || job.status);
  text('percent', done ? '100%' : m?.total > 0 ? percentage.toFixed(1) + '%' : '—');
  text('bytes', m ? bytes(m.done) + (m.total > 0 ? ' / ' + bytes(m.total) : '') : '—');
  text('speed', m?.speed > 0 && active === job.id && job.status === 'Downloading' ? (m.speed / 1024 ** 2).toFixed(1) + ' MiB/s' : '— MiB/s');
  text('eta', m?.speed > 0 && m.total > m.done && active === job.id && job.status === 'Downloading' ? 'ETA ' + eta((m.total - m.done) / m.speed) : 'ETA —');
  if (!m?.total && active === job.id && ['Listing', 'Checking', 'Downloading', 'Verifying'].includes(job.status)) $('progress').removeAttribute('value');
  else $('progress').value = percentage;
  $('pause').hidden = active !== job.id;
  $('pause').disabled = paused;
  $('remove').disabled = active === job.id || pending;
  $('deleteFiles').disabled = active === job.id || pending;
  $('clearPartials').disabled = Boolean(active) || pending;
  $('resume').hidden = done || Boolean(active);
  $('resume').disabled = pending || !online;
  text('resume', ((job.folder && job.kind !== 'folder') || job.onePass) && !job.canFinish ? 'Restart' : 'Resume');
  $('refresh').hidden = done || job.kind === 'folder' || Boolean(active) || Boolean(job.canFinish);
  $('refresh').disabled = pending || !online;
  $('reveal').hidden = !done;
}
window.receive = event => {
  switch (event.type) {
    case 'update':
      updateAvailable=event.available;
      text('updates',event.available?'Update GOB to '+event.version:'Check for updates');
      if(event.message) notice(event.message);
      break;
    case 'ready':
      online = event.available; if (!$('destination').value) $('destination').value = event.downloads || '';
      if (!online) notice('Install aria2 with brew install aria2, then reopen the app.'); break;
    case 'folder': $('destination').value = event.path; break;
    case 'error': pending = false; notice(event.message); break;
    case 'disconnected': pending = false; online = false; active = null; notice(event.message); break;
    case 'history': {
      const old = active;
      jobs = event.jobs;
      active = event.active;
      if (!active) paused = false;
      if (active && active !== old) selected = active;
      if (!jobs.some(j => j.id === selected)) selected = active || jobs[0]?.id;
      pending = false;
      break;
    }
  }
  render();
};
let updateAvailable=false;
$('updates').onclick=()=>send({action:updateAvailable?'installUpdate':'checkUpdate'});
$('browse').onclick = () => send({ action: 'chooseFolder' });
$('notifications').onchange = () => { if ($('notifications').checked) send({ action: 'notificationPermission' }); };
$('setup').onsubmit = event => {
  event.preventDefault();
  if (!online || active || pending) return;
  notice(''); pending = true; render();
  send({ action: 'start', ...Object.fromEntries(['link', 'name', 'destination', 'connections', 'speedCap', 'checksum',
    'brutal', 'subfolder', 'notifications', 'onePass'].map(id => [id, $(id).type === 'checkbox' ? $(id).checked : $(id).value])) });
};
$('pause').onclick = () => { paused = true; render(); send({ action: 'pause', id: selected }); };
$('remove').onclick = () => {
  if (active === selected || pending) return;
  if (confirm('Remove this download from History? Its downloaded files and partial progress stay on disk.')) {
    pending = true; render(); send({action:'remove', id:selected});
  }
};
$('deleteFiles').onclick = () => {
  if (active === selected || pending) return;
  if (confirm('Move this download’s tracked files and partials to Trash and remove it from History? Other files in the save folder stay untouched. Emptying Trash later reclaims the space.')) {
    pending = true; render(); send({action:'deleteFiles', id:selected});
  }
};
$('workingFolder').onclick = () => send({action:'workingFolder', id:selected});
$('clearPartials').onclick = () => {
  if (active) return notice('Pause the active download first.');
  if (confirm('Move this download’s partial files to Trash? Resume will start from zero. Empty Trash to reclaim storage.')) send({action:'clearPartials', id:selected});
};
$('log').onclick = () => send({ action: 'log', id: selected });
$('reveal').onclick = () => send({ action: 'reveal', id: selected });
function resume(changeLink) {
  if (!online || active || pending) return;
  const job = jobs.find(j => j.id === selected);
  if (!job || job.status === 'Completed') return;
  const restart = ((job.folder && job.kind !== 'folder') || job.onePass) && !job.canFinish;
  if (!restart && !changeLink) return launchResume(job.id, false);
  dialogJob = { id: job.id, restart };
  editLink = changeLink;
  text('resumeTitle', changeLink ? 'Update Dropbox link' : 'Restart download');
  text('resumeDescription', restart ? 'This transfer needs a fresh copy. Any saved partial is kept separately.' :
    'Paste the refreshed link. Saved progress is reused when the source checks match.');
  $('newLinkField').hidden = !changeLink;
  $('newLink').required = changeLink;
  $('newLink').value = '';
  text('confirm', restart ? 'Restart' : 'Resume');
  $('resumeDialog').showModal();
}
function launchResume(id, restart, link = '') {
  notice(''); pending = true; render();
  send({ action: 'resume', id, restart, link });
}
$('resume').onclick = () => resume(false);
$('refresh').onclick = () => resume(true);
$('cancel').onclick = () => $('resumeDialog').close();
$('resumeForm').onsubmit = event => {
  event.preventDefault();
  $('resumeDialog').close();
  if (dialogJob && !active && !pending) launchResume(dialogJob.id, dialogJob.restart, editLink ? $('newLink').value : '');
};
render();
</script>
</body>
</html>

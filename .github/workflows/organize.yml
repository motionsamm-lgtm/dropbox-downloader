name: Organize desktop downloader source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Expand sources and organize documentation
        shell: python
        run: |
          import base64, io, pathlib, re, zipfile
          root = pathlib.Path('.')
          workflow = (root/'.github/workflows/desktop-updates.yml').read_text()
          encoded = re.search(r"<<'SOURCE'\n(.*?)\n          SOURCE",workflow,re.S).group(1)
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(encoded))) as z:
              for info in z.infolist():
                  path = pathlib.PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts
              z.extractall('.')
          archive = root/'docs/archive'
          archive.mkdir(parents=True,exist_ok=True)
          for name in ['mac-release.yml','desktop-updates.yml']:
              p = root/'.github/workflows'/name
              if p.exists(): (archive/name).write_bytes(p.read_bytes())
          (root/'README.md').write_bytes(base64.b64decode(''))
          (root/'.gitignore').write_text('**/build/\n**/dist/\n**/payload.zip\n**/aria2c.exe\n.DS_Store\n')
      - name: Commit organized source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mac windows docs README.md .gitignore
          git commit -m "Organize Windows and Mac sources, documentation and builds"
          git push

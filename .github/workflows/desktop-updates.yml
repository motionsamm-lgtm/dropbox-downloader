name: Build Windows and Mac updates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - name: Build and verify Mac app
        working-directory: mac
        run: bash Scripts/package-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mac-${{ matrix.runner }}
          path: mac/dist/*.zip
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and verify Windows EXE
        shell: powershell
        working-directory: windows
        run: .\Build-Windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: windows/dist/DropboxDownloader.exe
          if-no-files-found: error

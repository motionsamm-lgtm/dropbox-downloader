name: Prepare GOB matte-black icon release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply approved icon and release checks
        shell: python
        run: |
          import pathlib,json,gzip,base64,subprocess
          files=json.loads(gzip.decompress(base64.b64decode('')))
          for name,data in files.items():
              p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(data))
          import shutil
          pathlib.Path('assets/windows').mkdir(parents=True,exist_ok=True)
          for name in ['GOB.ico','GOB.png']: shutil.copyfile('assets/'+name,'assets/windows/'+name)
          # Do not turn intentionally suppressed scripting errors into host crashes.
          p=pathlib.Path('windows/Launcher.cs');s=p.read_text();assert 'if(ps.HadErrors)' in s
          s=s.replace('if(ps.HadErrors)', 'if(ps.InvocationStateInfo.State == PSInvocationState.Failed)');p.write_text(s)
          p=pathlib.Path('windows/Build-Windows.ps1');s=p.read_text(encoding='utf-8-sig')
          marker="if ($LASTEXITCODE) { throw 'Download engine did not start.' }"
          assert marker in s
          s=s.replace(marker,marker+"\nGet-Process -Id 2147483646 -ErrorAction SilentlyContinue | Out-Null")
          p.write_text(s,encoding='utf-8-sig')
          subprocess.run(['python','.github/scripts/stamp-version.py','1.0.2'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','assets','windows','mac','.github'],check=True)
          subprocess.run(['git','commit','-m','Prepare GOB 1.0.2 with blue doodle icon and verified upgrades'],check=True)
          subprocess.run(['git','push'],check=True)

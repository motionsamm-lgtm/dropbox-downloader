name: Release GOB for Windows and Mac
on:
  workflow_dispatch:
    inputs:
      version:
        description: New version, increase for every release
        required: true
        default: '1.2.0'
        type: string
      publish:
        description: Publish after the platform checks (main branch only)
        required: true
        default: true
        type: boolean
concurrency:
  group: gob-production-release
  cancel-in-progress: false
permissions:
  contents: read
env:
  GOB_VERSION: ${{ inputs.version }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate version and avoid replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GOB_DRIVE_API_KEY: ${{ secrets.GOB_DRIVE_API_KEY }}
        run: |
          python -c 'import os,re; assert re.fullmatch(r"\d+\.\d+\.\d+",os.environ["GOB_VERSION"])'
          python -c 'import os; assert os.environ.get("GOB_DRIVE_API_KEY"), "Add the restricted GOB_DRIVE_API_KEY repository secret before building a Drive-enabled release."'
          if gh release view "gob-v$GOB_VERSION" >/dev/null 2>&1; then echo 'This release version already exists.'; exit 1; fi
      - name: Stamp release version in actual sources
        run: python .github/scripts/stamp-version.py "$GOB_VERSION"
      - name: Commit versioned release source
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows mac
          if ! git diff --cached --quiet; then git commit -m "Set GOB version $GOB_VERSION"; git push; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Compile native app and standard installer
        shell: powershell
        env:
          GOB_DRIVE_API_KEY: ${{ secrets.GOB_DRIVE_API_KEY }}
        run: ./windows/Build-Windows.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real-engine pause, resume and exact file tracking
        shell: powershell
        run: ./.github/scripts/test-download-controls.ps1
      - name: Verify folder aggregation, recovery and anonymous listing
        shell: powershell
        run: ./.github/scripts/test-folder-controls.ps1
      - name: Verify actual native Windows Dropbox folder transfer
        shell: powershell
        run: ./.github/scripts/test-real-windows-folder.ps1
      - name: Verify old-to-new Windows upgrade and retained history
        shell: powershell
        run: ./.github/scripts/test-windows-upgrade.ps1 -NewSetup "$pwd\windows\dist\GOB-Setup.exe" -Version $env:GOB_VERSION
      - name: Defender custom scan and status
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-MpComputerStatus | Select-Object AntivirusEnabled,RealTimeProtectionEnabled,AntivirusSignatureVersion | Format-List
          Start-MpScan -ScanType CustomScan -ScanPath "$pwd\windows\dist"
          $detections=@(Get-MpThreatDetection | Where-Object { $_.Resources -match 'GOB' })
          if($detections.Count) { $detections | Format-List *; throw 'Defender reported a GOB detection.' }
      - uses: actions/upload-artifact@v4
        with:
          name: GOB-Windows
          path: |
            windows/dist/GOB.exe
            windows/dist/GOB-Setup.exe
            windows/dist/GOB-Windows-Portable.zip
          if-no-files-found: error
  mac:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-26-intel
          - arch: arm64
            runner: macos-26-intel
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Build and verify architecture, signature and transfer tests
        working-directory: mac
        env:
          GOB_NATIVE_ARCH: ${{ matrix.arch }}
          GOB_DRIVE_API_KEY: ${{ secrets.GOB_DRIVE_API_KEY }}
        run: bash Scripts/package-mac.sh
      - name: Verify real folder pause, restart, native publication and Trash
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gob-real-runtime"
          unzip -q mac/dist/GOB-Mac-Intel.zip -d "$RUNNER_TEMP/gob-real-runtime"
          runtime_app=$(find "$RUNNER_TEMP/gob-real-runtime" -type d -name GOB.app -print -quit)
          test -n "$runtime_app"
          "$runtime_app/Contents/MacOS/node" .github/scripts/test-real-folder.mjs "$runtime_app/Contents/MacOS/aria2c" "$runtime_app/Contents/MacOS/DropboxDownloader"
      - name: Verify actual old Mac replacement helper
        if: matrix.arch == 'x86_64'
        run: bash .github/scripts/test-mac-upgrade.sh "$PWD/mac/dist/GOB-Mac-Intel.zip" "$GOB_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: GOB-Mac-${{ matrix.arch }}
          path: mac/dist/*.zip
          if-no-files-found: error
  release:
    needs: [prepare, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Create manifest from actual release asset bytes
        shell: python
        run: |
          import hashlib,json,os,pathlib
          version=os.environ['GOB_VERSION'];root=pathlib.Path('release-files')
          names={'windows':'GOB.exe','mac-arm64':'GOB-Mac-Apple-Silicon.zip','mac-x64':'GOB-Mac-Intel.zip'}
          assets={}
          for platform,name in names.items():
              file=root/name
              assert file.stat().st_size>0
              assets[platform]={'url':f'https://github.com/motionsamm-lgtm/dropbox-downloader/releases/download/gob-v{version}/{name}','size':file.stat().st_size,'sha256':hashlib.sha256(file.read_bytes()).hexdigest()}
          (root/'gob-update.json').write_text(json.dumps({'version':version,'assets':assets},indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: GOB-update-manifest
          path: release-files/gob-update.json
          if-no-files-found: error
      - name: Publish tested stable release and update feed
        if: inputs.publish && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Blue doodle goblin on a matte black tile, with transparent outer corners, on Windows and Mac. Existing download interface, transfer engine, saved progress and history are preserved. Windows includes the native GOB process identity and standard installer from the working Windows test build.

          In GOB, choose Check for updates, then Update GOB after pausing or finishing downloads. The app verifies the release file before installation. Windows installer-upgrade and Mac replacement-helper checks gate publication, alongside build and regression tests. Mac packages have architecture, signature and regression checks. Apple Silicon is cross-compiled on an Intel build machine; native Apple Silicon device testing remains a limitation. Mac builds are ad hoc signed and not notarized. Windows Defender custom scans are checked; the build runner's real-time protection is off, so this is not a Microsoft clearance or a guarantee against future detections.
          EOF
          if [ -f "docs/GOB-$GOB_VERSION.md" ]; then cp "docs/GOB-$GOB_VERSION.md" "$RUNNER_TEMP/notes.md"; fi
          git fetch origin main
          python - <<'PYCODE'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','HEAD','origin/main'],text=True).splitlines()
          assert all(p.startswith('.github/workflows/') or p.startswith('docs/') or p=='README.md' for p in changed), 'App source changed while building; rebuild before release.'
          PYCODE
          publication_sha=$(git rev-parse origin/main)
          gh release create "gob-v$GOB_VERSION" release-files/* --target "$publication_sha" --latest --title "GOB $GOB_VERSION - Grab Our Bytes" --notes-file "$RUNNER_TEMP/notes.md"
  verify-public:
    if: inputs.publish && github.ref_name == 'main'
    needs: [prepare, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: GOB-update-manifest
          path: release-files
      - name: Verify public anonymous update feed and every update asset
        run: |
          for attempt in {1..12}; do
            curl --fail --location --retry 3 'https://github.com/motionsamm-lgtm/dropbox-downloader/releases/latest/download/gob-update.json' -o live-manifest.json
            if cmp -s live-manifest.json release-files/gob-update.json; then break; fi
            sleep 5
          done
          cmp live-manifest.json release-files/gob-update.json
          python .github/scripts/verify-live-manifest.py live-manifest.json
  live-windows-update:
    needs: [prepare, verify-public]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Verify actual 1.0.1 native client through production update feed
        shell: powershell
        run: ./.github/scripts/test-live-windows-update.ps1 -Version $env:GOB_VERSION

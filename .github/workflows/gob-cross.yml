name: Build GOB Apple Silicon on Intel host
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  mac:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - name: Configure cross compilation for Apple Silicon
        shell: python
        run: |
          from pathlib import Path
          p=Path('mac/Build-Mac.command');s=p.read_text().replace('$(uname -m)-apple-macosx14.0','${GOB_NATIVE_ARCH:-$(uname -m)}-apple-macosx14.0');p.write_text(s)
          p=Path('mac/Scripts/package-mac.sh');s=p.read_text().replace('case "$(uname -m)" in','case "${GOB_NATIVE_ARCH:-$(uname -m)}" in')
          s=s.replace('export MACOSX_DEPLOYMENT_TARGET=14.0','''export MACOSX_DEPLOYMENT_TARGET=14.0
          cross_options=()
          if [[ "$arch" = arm64 && "$(uname -m)" = x86_64 ]]; then
              export CC="clang -arch arm64"
              export CXX="clang++ -arch arm64"
              cross_options=(--host=aarch64-apple-darwin --build=x86_64-apple-darwin)
          fi''')
          s=s.replace('./configure --with-appletls','./configure "${cross_options[@]}" --with-appletls')
          a=s.index('"$bin/node" --version');b=s.index('package="$workspace/GOB for Mac"',a)
          s=s[:a]+'''for binary in "$bin/node" "$bin/aria2c" "$bin/DropboxDownloader"; do
          /usr/bin/lipo "$binary" -verify_arch arm64
          done
          host_node="$(command -v node)"
          "$host_node" --test Tests/*.test.mjs
          # Run the same native helper source for filesystem tests on the Intel build host.
          /usr/bin/xcrun swiftc -swift-version 5 Sources/main.swift -o "$workspace/HostHelper"
          mkdir -p "$workspace/smoke"
          printf 'original' > "$workspace/smoke/existing"
          printf 'verified' > "$workspace/smoke/partial"
          if "$workspace/HostHelper" --publish "$workspace/smoke/partial" "$workspace/smoke/existing"; then exit 1; fi
          "$workspace/HostHelper" --publish "$workspace/smoke/partial" "$workspace/smoke/saved"
          test "$(cat "$workspace/smoke/saved")" = verified
          
          '''+s[b:];p.write_text(s)
      - name: Build and verify GOB Mac
        working-directory: mac
        run: GOB_NATIVE_ARCH=arm64 bash Scripts/package-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GOB-${{ matrix.runner }}
          path: mac/dist/*.zip
          if-no-files-found: error
  release:
    needs: [mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: GOB-Windows
          path: release-files
          run-id: 44054788614
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: GOB-macos-15-intel
          path: release-files
          run-id: 44054788614
          github-token: ${{ github.token }}
      - name: Generate checked update manifest
        shell: python
        run: |
          import hashlib,json,pathlib
          root=pathlib.Path('release-files')
          names={'windows':'GOB.exe','mac-arm64':'GOB-Mac-Apple-Silicon.zip','mac-x64':'GOB-Mac-Intel.zip'}
          assets={}
          for platform,name in names.items():
              file=root/name
              assets[platform]={'url':'https://github.com/motionsamm-lgtm/dropbox-downloader/releases/download/gob-v1.0.0/'+name,'size':file.stat().st_size,'sha256':hashlib.sha256(file.read_bytes()).hexdigest()}
          (root/'gob-update.json').write_text(json.dumps({'version':'1.0.0','assets':assets},indent=2))
      - name: Publish GOB release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create gob-v1.0.0 release-files/* --target "$GITHUB_SHA" --title "GOB 1.0.0 — Grab Our Bytes" --notes "GOB for Windows and macOS. Includes the GOB icon, Start menu branding, update checks and checksum-verified update downloads. Mac builds are ad hoc signed and have not been notarized."

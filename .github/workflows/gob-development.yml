name: Test GOB download reliability
jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: node --test mac/Tests/*.test.mjs
    - run: node --check shared/dropbox-folder.mjs
    - name: Check public Dropbox folder listing and one range
      run: node .github/scripts/probe-public-folder.mjs
  windows-tests:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build and test native Windows GUI
      shell: powershell
      env:
        # Test-only value; never a usable credential. Release builds use the private Actions secret.
        GOB_DRIVE_API_KEY: 'AIza0123456789abcdefghij-0123456789'
      run: ./windows/Build-Windows.ps1
    - name: Real engine completion, errors, pause and resume
      shell: powershell
      run: ./.github/scripts/test-download-controls.ps1
    - name: Folder queue and lifecycle regression checks
      shell: powershell
      run: ./.github/scripts/test-folder-controls.ps1
    - name: Native Windows real Dropbox folder transfer
      shell: powershell
      run: ./.github/scripts/test-real-windows-folder.ps1
  mac-native-tests:
    runs-on: macos-26-intel
    steps:
    - uses: actions/checkout@v5
    - name: Test the new Mac host and folder engine with the bundled runtime
      shell: bash
      run: 'set -euo pipefail

        curl -fL --retry 3 https://github.com/motionsamm-lgtm/dropbox-downloader/releases/download/gob-v1.0.2/GOB-Mac-Intel.zip -o "$RUNNER_TEMP/gob-runtime.zip"

        echo ''3945fce7a6698b6c1af119005ba801b7ef5b4661fb719d6fcfa480f151309cfe  ''"$RUNNER_TEMP/gob-runtime.zip" | shasum -a 256 -c -

        unzip -q "$RUNNER_TEMP/gob-runtime.zip" -d "$RUNNER_TEMP/gob-runtime"

        runtime_app=$(find "$RUNNER_TEMP/gob-runtime" -type d -name GOB.app -print -quit)

        test -n "$runtime_app"

        xcrun swiftc -target x86_64-apple-macosx14.0 -swift-version 5 -O mac/Sources/main.swift -o "$RUNNER_TEMP/GOBHost"

        "$runtime_app/Contents/MacOS/node" --test mac/Tests/*.test.mjs

        "$runtime_app/Contents/MacOS/node" .github/scripts/test-real-folder.mjs "$runtime_app/Contents/MacOS/aria2c" "$RUNNER_TEMP/GOBHost"

        '
permissions:
  contents: read
'on':
  workflow_dispatch: {}
  pull_request:
    paths:
    - windows/**
    - mac/**
    - shared/**
    - .github/scripts/**

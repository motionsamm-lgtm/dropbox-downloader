name: Develop GOB folder downloads and controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply next-update sources on development branch
        id: apply
        shell: python
        run: |
          import pathlib,json,gzip,base64,subprocess,hashlib,os
          data=json.loads(gzip.decompress(base64.b64decode('')))
          for name,expected in data['bases'].items():
              current=pathlib.Path(name).read_text(encoding='utf-8-sig').replace('\r\n','\n')
              actual=hashlib.sha256(current.encode()).hexdigest()
              if actual!=expected: actual=hashlib.sha256(current.rstrip('\n').encode()).hexdigest()
              if actual!=expected: raise RuntimeError('Baseline changed: '+name+'; review before replacing it')
          branch='gob-next-update'
          exists=subprocess.run(['git','show-ref','--verify','--quiet','refs/remotes/origin/'+branch]).returncode==0
          subprocess.run(['git','checkout','-B',branch,'origin/'+branch if exists else 'HEAD'],check=True)
          for name,content in data['files'].items():
              p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(content))
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','windows','mac','shared','.github/scripts'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
              subprocess.run(['git','commit','-m','Develop pause, resume and safe download removal controls'],check=True)
          subprocess.run(['git','push','origin',branch],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha='+sha+'\n')
  portable-tests:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test mac/Tests/*.test.mjs
      - run: node --check shared/dropbox-folder.mjs
      - name: Check public Dropbox folder listing and one range
        run: node .github/scripts/probe-public-folder.mjs
  windows-tests:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test native Windows GUI
        shell: powershell
        run: ./windows/Build-Windows.ps1
      - name: Real engine completion, errors, pause and resume
        shell: powershell
        run: ./.github/scripts/test-download-controls.ps1
      - name: Folder queue and lifecycle regression checks
        shell: powershell
        run: ./.github/scripts/test-folder-controls.ps1

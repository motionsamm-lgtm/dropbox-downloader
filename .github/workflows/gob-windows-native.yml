name: Build GOB Windows native app test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply transparent host and installer repair
        shell: python
        run: |
          import base64, gzip, json, pathlib, hashlib, subprocess
          core = ['windows/Dropbox-Downloader.ps1','windows/Download-Reliability.ps1','windows/Download-History.ps1','windows/Download-Log.ps1']
          before = {p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in core}
          files = json.loads(gzip.decompress(base64.b64decode('')))
          for name, data in files.items():
              p = pathlib.Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(data))
          assert all(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==digest for p,digest in before.items()), 'Core transfer files changed'
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','windows','assets/windows'], check=True)
          subprocess.run(['git','commit','-m','Separate GOB Windows setup from native app hosting'], check=True)
          subprocess.run(['git','push'], check=True)
      - name: Build and check Windows app
        shell: powershell
        run: ./windows/Build-Windows.ps1
      - name: Scan distribution with available Microsoft Defender
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-MpComputerStatus | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, AntivirusSignatureVersion | Format-List
          Start-MpScan -ScanType CustomScan -ScanPath "$pwd\windows\dist"
          $threats = @(Get-MpThreatDetection | Where-Object { $_.Resources -match 'GOB|windows\\dist' })
          if ($threats.Count) { $threats | Format-List *; throw 'Defender reported a GOB detection.' }
      - uses: actions/upload-artifact@v4
        with:
          name: GOB-Windows-1.0.1-test
          path: |
            windows/dist/GOB-Setup.exe
            windows/dist/GOB-Windows-Portable.zip
      - name: Publish Windows test build
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows test build: standard per-user installer, native GOB window/process identity and transparent icon corners. Existing transfer engine and history are preserved. No powershell.exe child processes, normal-launch extraction or self-copying. This is a pre-release pending testing on affected devices; Microsoft has not reviewed/cleared the earlier detection. Keep Defender enabled. Mac release is unchanged.
          '@
          $notes | Set-Content "$env:RUNNER_TEMP\notes.txt"
          gh release create gob-v1.0.1-rc1 --prerelease --title 'GOB 1.0.1 Windows test — native app and installer' --notes-file "$env:RUNNER_TEMP\notes.txt" windows/dist/GOB-Setup.exe windows/dist/GOB-Windows-Portable.zip
          if ($LASTEXITCODE) { throw 'Test release publication failed.' }
